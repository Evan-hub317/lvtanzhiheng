server:
  port: 8080

spring:
  application:
    name: smart-carbon
  config:
    # 导入本地密钥配置（application-secret.yml 不入库；optional 表示缺失也能启动）
    import: optional:classpath:application-secret.yml
  ai:
    deepseek:
      base-url: https://api.deepseek.com
      api-key: ""
      chat:
        options:
          model: deepseek-flash
    # 备用模型：千问 qwen3.8-flash（百炼专属 MaaS 部署端点，故障转移用）
    # 注意：Spring AI OpenAI 客户端会在 base-url 后自动拼接 /v1/chat/completions，
    # 因此这里不能带 /v1，否则与兼容端点路径重复导致 404
    openai:
      base-url: https://ws-7ye0l4xplondv1u2.cn-beijing.maas.aliyuncs.com/compatible-mode
      api-key: ""
      chat:
        options:
          model: qwen3.8-flash
  servlet:
    multipart:
      # 知识库文档上传限制（扫描版 PDF 体积较大）
      max-file-size: 20MB
      max-request-size: 20MB
  # 数据库：先执行数据库初始化脚本（init.sql），再按本机修改用户名密码
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/smart_carbon?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # 关闭 SQL 打印（生产环境减噪）；本地调试 SQL 时临时改回
    # org.apache.ibatis.logging.stdout.StdOutImpl 即可
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

# 日志级别：框架层降噪，业务日志（com.smart）保持 info
logging:
  level:
    root: info
    org.mybatis: warn
    com.baomidou: warn
    # Spring AI 重试框架：每次主模型失败（401/5xx）都打整段堆栈，噪声大；
    # 失败与回退信息已由 AiRouter 单行日志记录，这里降为 error 只保留真实异常
    org.springframework.ai.retry.autoconfigure: error
  global-config:
    banner: false
    db-config:
      id-type: auto

# Sa-Token 配置：前端请求头携带 satoken
sa-token:
  token-name: satoken
  timeout: 86400
  is-log: false

# Python 算法服务地址（预测/仿真/异常检测/RAG）
algo:
  base-url: http://localhost:8000

# 应用配置
app:
  # 上传文件存储目录（知识库 kb、头像 images 均在其下），按「进程工作目录」相对解析。
  # 请务必从项目根目录启动后端（mvn -f smart/pom.xml spring-boot:run），
  # 使 uploads 落在项目根、与 kb 同级；部署时 jar 同级放 uploads/ 即可
  upload-dir: uploads

# Knife4j 接口文档（启动后访问 http://localhost:8080/doc.html）
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

knife4j:
  enable: true
  setting:
    language: zh_cn
